# SCPI-Controlled DAQ System for STM32N657 (NUCLEO-N657X0-Q)
# Zephyr RTOS Configuration
# Zephyr 4.4.x

# ============================================================================
# CONSOLE / SERIAL / UART
# ============================================================================
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ============================================================================
# ADC
# ============================================================================
CONFIG_ADC=y

# ============================================================================
# FLOATING POINT / LIBC
# ============================================================================
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use Newlib explicitly
CONFIG_NEWLIB_LIBC=y
# CONFIG_PICOLIBC is not set

# ============================================================================
# KERNEL / THREADING
# ============================================================================
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_MPU_STACK_GUARD=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y

# ============================================================================
# GPIO
# ============================================================================
CONFIG_GPIO=y

# ============================================================================
# I2C
# ============================================================================
CONFIG_I2C=y

# ============================================================================
# LOGGING
# ============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Do NOT use CONFIG_UART_LOG.
# UART console/logging is handled by CONFIG_UART_CONSOLE.

# ============================================================================
# TIMING
# ============================================================================
# Zephyr kernel timers and the system workqueue are kernel facilities.
# CONFIG_TIMER and CONFIG_SYSTEM_WORKQUEUE are obsolete/undefined symbols
# in this Zephyr configuration, so they are intentionally omitted.

# ============================================================================
# BUILD / MEMORY
# ============================================================================
CONFIG_BUILD_NO_GAP_FILL=y
CONFIG_MPU_STACK_GUARD=y